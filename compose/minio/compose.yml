services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}

    volumes:
      - /opt/docker/minio/data:/data

    ports:
      - "127.0.0.1:9001:9001"

    networks:
      - internal
      - proxy

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.middlewares.minio-https.redirectscheme.scheme=https
      - traefik.http.middlewares.minio-https.redirectscheme.permanent=true
      - traefik.http.routers.minio-http.rule=Host(`${SERVICE_HOST:-s3.marca7.com.br}`)
      - traefik.http.routers.minio-http.entrypoints=web
      - traefik.http.routers.minio-http.middlewares=minio-https
      - traefik.http.routers.minio.rule=Host(`${SERVICE_HOST:-s3.marca7.com.br}`)
      - traefik.http.routers.minio.entrypoints=websecure
      - traefik.http.routers.minio.tls=true
      - traefik.http.routers.minio.tls.certresolver=letsencrypt
      - traefik.http.services.minio.loadbalancer.server.port=9000

networks:
  internal:
    external: true
    name: internal

  proxy:
    external: true
    name: proxy
