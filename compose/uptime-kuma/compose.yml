services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    ports:
      - "127.0.0.1:8082:3001"

    volumes:
      - /opt/docker/uptime-kuma/data:/app/data

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.middlewares.uptime-kuma-https.redirectscheme.scheme=https
      - traefik.http.middlewares.uptime-kuma-https.redirectscheme.permanent=true
      - traefik.http.routers.uptime-kuma-http.rule=Host(`${SERVICE_HOST:-uptimekuma.marca7.tech}`)
      - traefik.http.routers.uptime-kuma-http.entrypoints=web
      - traefik.http.routers.uptime-kuma-http.middlewares=uptime-kuma-https
      - traefik.http.routers.uptime-kuma.rule=Host(`${SERVICE_HOST:-uptimekuma.marca7.tech}`)
      - traefik.http.routers.uptime-kuma.entrypoints=websecure
      - traefik.http.routers.uptime-kuma.tls=true
      - traefik.http.routers.uptime-kuma.tls.certresolver=letsencrypt
      - traefik.http.services.uptime-kuma.loadbalancer.server.port=3001

networks:
  proxy:
    external: true
    name: proxy
