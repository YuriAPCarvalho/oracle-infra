services:
  gold-api:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    container_name: gold-api
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      PORT: "3000"
      WHATSAPP_AUTH_PATH: /data/auth_info

    volumes:
      - /opt/docker/applications/gold-api/auth_info:/data/auth_info

    networks:
      - gold-api-net
      - proxy

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.middlewares.gold-api-https.redirectscheme.scheme=https
      - traefik.http.middlewares.gold-api-https.redirectscheme.permanent=true
      # www is CNAME→apex at Cloudflare; keep Host apex-only so ACME HTTP-01 succeeds.
      - traefik.http.routers.gold-api-http.rule=Host(`${SERVICE_HOST:-scriptgold.com.br}`)
      - traefik.http.routers.gold-api-http.entrypoints=web
      - traefik.http.routers.gold-api-http.middlewares=gold-api-https
      - traefik.http.routers.gold-api.rule=Host(`${SERVICE_HOST:-scriptgold.com.br}`)
      - traefik.http.routers.gold-api.entrypoints=websecure
      - traefik.http.routers.gold-api.tls=true
      - traefik.http.routers.gold-api.tls.certresolver=letsencrypt
      - traefik.http.services.gold-api.loadbalancer.server.port=3000

networks:
  gold-api-net:
    name: gold-api-net
    driver: bridge

  proxy:
    external: true
    name: proxy
