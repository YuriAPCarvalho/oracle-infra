services:
  dozzle:
    image: amir20/dozzle:v10.6.6
    container_name: dozzle
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    environment:
      DOZZLE_LEVEL: info
      DOZZLE_NO_ANALYTICS: "true"

    ports:
      - "127.0.0.1:8081:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.middlewares.dozzle-https.redirectscheme.scheme=https
      - traefik.http.middlewares.dozzle-https.redirectscheme.permanent=true
      - traefik.http.routers.dozzle-http.rule=Host(`${SERVICE_HOST:-dozzle.marca7.tech}`)
      - traefik.http.routers.dozzle-http.entrypoints=web
      - traefik.http.routers.dozzle-http.middlewares=dozzle-https
      - traefik.http.routers.dozzle.rule=Host(`${SERVICE_HOST:-dozzle.marca7.tech}`)
      - traefik.http.routers.dozzle.entrypoints=websecure
      - traefik.http.routers.dozzle.tls=true
      - traefik.http.routers.dozzle.tls.certresolver=letsencrypt
      - traefik.http.services.dozzle.loadbalancer.server.port=8080

networks:
  proxy:
    external: true
    name: proxy
