services:
  watchtower:
    # Maintained fork — containrrr/watchtower breaks on Docker Engine 29+ (API min 1.44)
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Host GHCR auth from `docker login ghcr.io` (private packages)
      - /root/.docker/config.json:/config/config.json:ro

    environment:
      TZ: America/Sao_Paulo
      DOCKER_CONFIG: /config
      # Only containers with com.centurylinklabs.watchtower.enable=true
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_ROLLING_RESTART: "true"
