services:
  rankao-api:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    container_name: rankao-api
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}

    networks:
      - internal
      - proxy

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.middlewares.rankao-api-https.redirectscheme.scheme=https
      - traefik.http.middlewares.rankao-api-https.redirectscheme.permanent=true
      - traefik.http.routers.rankao-api-http.rule=Host(`${SERVICE_HOST:-api.chamaeu.app}`)
      - traefik.http.routers.rankao-api-http.entrypoints=web
      - traefik.http.routers.rankao-api-http.middlewares=rankao-api-https
      - traefik.http.routers.rankao-api.rule=Host(`${SERVICE_HOST:-api.chamaeu.app}`)
      - traefik.http.routers.rankao-api.entrypoints=websecure
      - traefik.http.routers.rankao-api.tls=true
      - traefik.http.routers.rankao-api.tls.certresolver=letsencrypt
      - traefik.http.services.rankao-api.loadbalancer.server.port=3000

networks:
  internal:
    external: true
    name: internal

  proxy:
    external: true
    name: proxy
