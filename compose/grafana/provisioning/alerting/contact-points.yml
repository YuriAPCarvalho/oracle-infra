apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-metrics
    receivers:
      - uid: discord-metrics
        type: discord
        disableResolveMessage: false
        settings:
          # Interpolated from GRAFANA_DISCORD_WEBHOOK_URL in the container env
          # (compose/grafana/.env via env_file). Prefer same channel as Uptime
          # Kuma (#infra-alertas); never reuse the CI webhook.
          url: $GRAFANA_DISCORD_WEBHOOK_URL
          title: |
            {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} {{ .CommonLabels.alertname }}
          message: |
            **Status:** {{ .Status }}
            {{ range .Alerts -}}
            • {{ .Annotations.summary }}
            {{ if .Annotations.description }}  {{ .Annotations.description }}
            {{ end -}}
            {{ if .Labels.severity }}  severity={{ .Labels.severity }}{{ end }}
            {{ end -}}
            [Grafana]({{ .ExternalURL }})

policies:
  - orgId: 1
    receiver: discord-metrics
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: discord-metrics
        object_matchers:
          - - severity
            - =~
            - warning|critical
