services:
  gold-admin:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    container_name: gold-admin
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.middlewares.gold-admin-https.redirectscheme.scheme=https
      - traefik.http.middlewares.gold-admin-https.redirectscheme.permanent=true
      - traefik.http.routers.gold-admin-http.rule=Host(`${SERVICE_HOST:-adm.scriptgold.com.br}`)
      - traefik.http.routers.gold-admin-http.entrypoints=web
      - traefik.http.routers.gold-admin-http.middlewares=gold-admin-https
      - traefik.http.routers.gold-admin.rule=Host(`${SERVICE_HOST:-adm.scriptgold.com.br}`)
      - traefik.http.routers.gold-admin.entrypoints=websecure
      - traefik.http.routers.gold-admin.tls=true
      - traefik.http.routers.gold-admin.tls.certresolver=letsencrypt
      - traefik.http.services.gold-admin.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
    name: proxy
