services:
  marca7-app:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    container_name: marca7-app
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - proxy

    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.middlewares.marca7-app-https.redirectscheme.scheme=https
      - traefik.http.middlewares.marca7-app-https.redirectscheme.permanent=true
      - traefik.http.routers.marca7-app-http.rule=Host(`${SERVICE_HOST:-gestoragro.marca7.tech}`)
      - traefik.http.routers.marca7-app-http.entrypoints=web
      - traefik.http.routers.marca7-app-http.middlewares=marca7-app-https
      - traefik.http.routers.marca7-app.rule=Host(`${SERVICE_HOST:-gestoragro.marca7.tech}`)
      - traefik.http.routers.marca7-app.entrypoints=websecure
      - traefik.http.routers.marca7-app.tls=true
      - traefik.http.routers.marca7-app.tls.certresolver=letsencrypt
      - traefik.http.services.marca7-app.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
    name: proxy
