services:
  marca7-api:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    container_name: marca7-api
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      PORT: "4000"

    ports:
      - "127.0.0.1:4000:4000"

    networks:
      - proxy
      - internal

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.middlewares.marca7-api-https.redirectscheme.scheme=https
      - traefik.http.middlewares.marca7-api-https.redirectscheme.permanent=true
      - traefik.http.routers.marca7-api-http.rule=Host(`${SERVICE_HOST:-api.marca7.com.br}`)
      - traefik.http.routers.marca7-api-http.entrypoints=web
      - traefik.http.routers.marca7-api-http.middlewares=marca7-api-https
      - traefik.http.routers.marca7-api.rule=Host(`${SERVICE_HOST:-api.marca7.com.br}`)
      - traefik.http.routers.marca7-api.entrypoints=websecure
      - traefik.http.routers.marca7-api.tls=true
      - traefik.http.routers.marca7-api.tls.certresolver=letsencrypt
      - traefik.http.services.marca7-api.loadbalancer.server.port=4000

networks:
  proxy:
    external: true
    name: proxy

  internal:
    external: true
    name: internal
