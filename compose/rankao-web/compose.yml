services:
  rankao-web:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    container_name: rankao-web
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.middlewares.rankao-web-https.redirectscheme.scheme=https
      - traefik.http.middlewares.rankao-web-https.redirectscheme.permanent=true
      - traefik.http.routers.rankao-web-http.rule=Host(`${SERVICE_HOST:-chamaeu.app}`)
      - traefik.http.routers.rankao-web-http.entrypoints=web
      - traefik.http.routers.rankao-web-http.middlewares=rankao-web-https
      - traefik.http.routers.rankao-web.rule=Host(`${SERVICE_HOST:-chamaeu.app}`)
      - traefik.http.routers.rankao-web.entrypoints=websecure
      - traefik.http.routers.rankao-web.tls=true
      - traefik.http.routers.rankao-web.tls.certresolver=letsencrypt
      - traefik.http.services.rankao-web.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
    name: proxy
