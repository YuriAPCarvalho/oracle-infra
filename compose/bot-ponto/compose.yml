services:
  bot-ponto:
    image: ${SERVICE_IMAGE:-bot-ponto:local}
    container_name: bot-ponto
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    shm_size: "1gb"

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      TZ: America/Campo_Grande
      TIMEZONE: America/Campo_Grande
      HEADLESS: "true"
      BROWSER_STATE_PATH: /opt/docker/bot-ponto/browser-state/storageState.json
      EXECUTIONS_STATE_PATH: /opt/docker/bot-ponto/state/executions.json
      HEARTBEAT_PATH: /opt/docker/bot-ponto/state/heartbeat.json
      LOCK_PATH: /opt/docker/bot-ponto/state/automation.lock
      SCREENSHOTS_DIR: /opt/docker/bot-ponto/screenshots
      SCREENSHOT_RETENTION_DAYS: "14"
      CONFIG_PATH: /app/config.json
      HEARTBEAT_MAX_AGE_SECONDS: "90000"

    volumes:
      - /opt/docker/bot-ponto:/opt/docker/bot-ponto
      - ./config.json:/app/config.json:ro

    networks:
      - bot-ponto-net
      - proxy

networks:
  bot-ponto-net:
    name: bot-ponto-net
    driver: bridge

  proxy:
    external: true
    name: proxy
