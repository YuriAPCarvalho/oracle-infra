services:
  rankao-adm:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    container_name: rankao-adm
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_URL: ${API_URL:-http://rankao-api:3000}

    networks:
      - internal
      - proxy

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.middlewares.rankao-adm-https.redirectscheme.scheme=https
      - traefik.http.middlewares.rankao-adm-https.redirectscheme.permanent=true
      - traefik.http.routers.rankao-adm-http.rule=Host(`${SERVICE_HOST:-adm.chamaeu.app}`)
      - traefik.http.routers.rankao-adm-http.entrypoints=web
      - traefik.http.routers.rankao-adm-http.middlewares=rankao-adm-https
      - traefik.http.routers.rankao-adm.rule=Host(`${SERVICE_HOST:-adm.chamaeu.app}`)
      - traefik.http.routers.rankao-adm.entrypoints=websecure
      - traefik.http.routers.rankao-adm.tls=true
      - traefik.http.routers.rankao-adm.tls.certresolver=letsencrypt
      - traefik.http.services.rankao-adm.loadbalancer.server.port=3000

networks:
  internal:
    external: true
    name: internal

  proxy:
    external: true
    name: proxy
