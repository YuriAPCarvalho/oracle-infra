services:
  waha:
    image: devlikeapro/waha:latest
    platform: linux/amd64
    container_name: waha
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      TZ: America/Sao_Paulo
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_API_KEY: ${WAHA_API_KEY:?set WAHA_API_KEY}
      WAHA_PRINT_QR: "false"

    volumes:
      - /opt/docker/waha/sessions:/app/.sessions

    networks:
      - internal

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --header=\"X-Api-Key: $$WAHA_API_KEY\" http://127.0.0.1:3000/api/server/status >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  internal:
    external: true
    name: internal
