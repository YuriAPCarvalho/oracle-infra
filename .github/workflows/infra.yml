name: Infra

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: |
          shellcheck -x -P scripts bootstrap/*.sh scripts/*.sh scripts/lib/*.sh

      - name: Bash syntax
        run: |
          bash -n bootstrap/*.sh scripts/*.sh scripts/lib/*.sh

      - name: Whitespace
        run: |
          git diff --check

      - name: Validate compose files
        run: |
          set -Eeuo pipefail
          pg_env="compose/postgres/.env"
          if [[ ! -f "${pg_env}" ]]; then
            cp compose/postgres/.env.example "${pg_env}"
            echo 'POSTGRES_PASSWORD=placeholder-validate-only' >> "${pg_env}"
          fi
          gf_env="compose/grafana/.env"
          if [[ ! -f "${gf_env}" ]]; then
            cp compose/grafana/.env.example "${gf_env}"
            {
              echo 'SERVICE_HOST=grafana.chamaeu.app'
              echo 'GF_SECURITY_ADMIN_USER=admin'
              echo 'GF_SECURITY_ADMIN_PASSWORD=placeholder-validate-only'
            } >> "${gf_env}"
          fi
          while IFS= read -r -d '' file; do
            echo "Validating ${file}"
            docker compose -f "${file}" config -q
          done < <(find compose -name 'compose.yml' -print0)

      - name: Validate Prometheus config and rules
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/compose/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.2.1 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/compose/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.2.1 \
            check rules /etc/prometheus/rules/host-alerts.yml /etc/prometheus/rules/container-alerts.yml

      - name: Validate Grafana dashboard JSON
        run: |
          set -Eeuo pipefail
          for f in compose/grafana/provisioning/dashboards/json/*.json; do
            echo "Validating ${f}"
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "${f}"
          done

      - name: Validate service template
        run: |
          set -Eeuo pipefail
          template_env="templates/docker-service/.env"
          trap 'rm -f "${template_env}"' EXIT
          cat >"${template_env}" <<'EOF'
          SERVICE_NAME=template-service
          SERVICE_IMAGE=busybox:latest
          SERVICE_HOST=template.local
          SERVICE_PORT=8080
          EOF
          docker compose -f templates/docker-service/compose.yml config -q

      - name: Check for committed env files
        run: |
          set -Eeuo pipefail
          tracked_env_files="$(
            git ls-files |
              grep -E '(^|/)\.env($|\.)' |
              grep -v -E '(^|/)\.env\.example$' || true
          )"
          if [[ -n "${tracked_env_files}" ]]; then
            echo "Tracked real .env files are not allowed:"
            printf '%s\n' "${tracked_env_files}"
            exit 1
          fi

      - name: Secret scan
        run: |
          set -Eeuo pipefail
          if git grep -nIE -- '-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{30,}|mfa\.[A-Za-z0-9_-]{20,}' ':!backups' ':!logs'; then
            echo "Potential secret detected."
            exit 1
          fi
          if git grep -nIE -- '^[[:space:]]*[A-Za-z0-9_]*(TOKEN|SECRET|PASSWORD|PRIVATE_KEY)[A-Za-z0-9_]*[[:space:]]*=[^#[:space:]]+' -- '*.env' '*.env.example' 'services/**' 'templates/**'; then
            echo "Potential uncommented secret assignment detected."
            exit 1
          fi

      - name: Validate workflows and CI templates
        run: |
          set -Eeuo pipefail
          bash scripts/validate-workflows.sh

      - name: Discord notify dry-run
        run: |
          set -Eeuo pipefail
          bash scripts/discord-notify.sh --dry-run \
            --title "CI dry-run" \
            --service "oracle-infra" \
            --environment "ci" \
            --status started \
            --commit "${GITHUB_SHA}" \
            --author "github-actions" \
            --branch "${GITHUB_REF_NAME}" \
            --message "payload only"
